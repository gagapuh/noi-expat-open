<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>NOI EXPAT OPEN — Tournament Schedule</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: {
              0: '#ffffff',
              1: '#fafaf9',
              2: '#f5f5f4',
              3: '#e7e5e4',
            },
            accent: {
              lime: '#c8ee44',
              glow: '#d4f542',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            display: ['Outfit', 'Inter', 'sans-serif']
          },
          boxShadow: {
            'card': '0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03)',
            'card-hover': '0 2px 8px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.04)',
            'elevated': '0 4px 16px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04)',
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="logo.png">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css?v=200">
</head>
<body class="bg-surface-2 text-stone-900 min-h-screen flex flex-col antialiased selection:bg-accent-lime/40 selection:text-stone-950">

  <!-- ═══════════════ HEADER ═══════════════ -->
  <header class="border-b border-stone-200/60 bg-white/70 backdrop-blur-2xl backdrop-saturate-150 sticky top-0 z-50">
    <div class="max-w-[1640px] mx-auto px-5 sm:px-8 h-[60px] sm:h-[68px] flex items-center justify-between">
      
      <!-- Brand -->
      <div class="flex items-center gap-3">
        <img src="logo.png" alt="NOI EXPAT OPEN" class="h-9 sm:h-10 w-auto object-contain rounded-xl shadow-2xs" />
        <h1 id="tournamentTitle" class="text-[17px] sm:text-[19px] font-display font-extrabold tracking-[-0.025em] text-stone-900 uppercase leading-none">
          NOI EXPAT OPEN
        </h1>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-2 no-print">
        <button id="printScheduleBtn" class="h-8 px-3 rounded-lg text-[13px] font-medium border border-stone-200 bg-white text-stone-500 hover:text-stone-800 hover:border-stone-300 transition-all duration-150 flex items-center gap-1.5 cursor-pointer">
          <i data-lucide="printer" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">Print</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ═══════════════ MAIN ═══════════════ -->
  <main class="flex-1 max-w-[1640px] w-full mx-auto px-4 sm:px-8 pt-5 pb-10 flex flex-col gap-4">
    
    <!-- Controls Bar -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
      
      <div class="inline-flex items-center gap-2">
        <button data-day="day1" class="day-tab-btn h-10 px-6 rounded-xl font-bold text-sm bg-stone-900 text-white shadow-md transition-all duration-200 whitespace-nowrap cursor-pointer">
          Day 1 — Saturday
        </button>
        <button data-day="day2" class="day-tab-btn h-10 px-6 rounded-xl font-bold text-sm bg-white text-stone-600 border border-stone-300 hover:border-stone-400 hover:text-stone-900 transition-all duration-200 whitespace-nowrap cursor-pointer">
          Day 2 — Sunday
        </button>
      </div>

      <!-- Mobile Court Switcher -->
      <div id="mobileCourtTabs" class="inline-flex items-center p-1 rounded-xl bg-stone-100 border border-stone-200/50 lg:hidden">
        <!-- Dynamically filled by app.js -->
      </div>
    </div>

    <!-- Schedule Grid -->
    <div class="rounded-2xl border border-stone-200/70 bg-white overflow-hidden shadow-card relative flex flex-col">
      <div class="overflow-x-auto relative" id="gridTableContainer">
        <!-- Dynamically rendered by app.js -->
      </div>
    </div>

  </main>

  <!-- Scripts -->
  <script src="data.js?v=200"></script>
  <script src="app.js?v=200"></script>
</body>
</html>
