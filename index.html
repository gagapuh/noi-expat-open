<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>NOI EXPAT OPEN — Tournament Schedule</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: {
              0: '#ffffff',
              1: '#fafaf9',
              2: '#f5f5f4',
              3: '#e7e5e4',
            },
            accent: {
              lime: '#c8ee44',
              glow: '#d4f542',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            display: ['Outfit', 'Inter', 'sans-serif']
          },
          boxShadow: {
            'card': '0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03)',
            'card-hover': '0 2px 8px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.04)',
            'elevated': '0 4px 16px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04)',
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=2">
  <link rel="shortcut icon" href="favicon.ico?v=2">
  <link rel="manifest" href="site.webmanifest">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css?v=252">
</head>
<body class="bg-surface-2 text-stone-900 min-h-screen flex flex-col antialiased selection:bg-accent-lime/40 selection:text-stone-950">

  <!-- ═══════════════ HEADER ═══════════════ -->
  <header class="border-b border-stone-200/60 bg-white/70 backdrop-blur-2xl backdrop-saturate-150 sticky top-0 z-50">
    <div class="max-w-[1640px] mx-auto px-5 sm:px-8 h-[60px] sm:h-[68px] flex items-center justify-between">
      
      <!-- Brand -->
      <div class="flex items-center gap-3">
        <img src="logo.png?v=2" alt="NOI EXPAT OPEN" class="h-9 sm:h-10 w-auto object-contain" />
        <div class="flex flex-col">
          <h1 id="tournamentTitle" class="text-[17px] sm:text-[19px] font-display font-extrabold tracking-[-0.025em] text-stone-900 uppercase leading-none">
            NOI EXPAT OPEN
          </h1>
          <span class="text-[11px] font-semibold text-stone-400 tracking-wider uppercase mt-1">October 3–4, 2026</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-2 no-print">
        <button 
          id="locationBtn" 
          onclick="openLocationModal()" 
          class="h-8 sm:h-9 px-3 rounded-xl text-xs font-bold border border-stone-200/90 bg-white hover:bg-stone-50 text-stone-800 shadow-2xs hover:shadow-xs transition-all flex items-center gap-1.5 cursor-pointer">
          <i data-lucide="map-pin" class="w-3.5 h-3.5 text-rose-500"></i>
          <span>Directions</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ═══════════════ MAIN ═══════════════ -->
  <main class="flex-1 max-w-[1640px] w-full mx-auto px-4 sm:px-8 pt-5 pb-10 flex flex-col gap-4">
    
    <!-- Controls Bar -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
      
      <div class="inline-flex items-center gap-2">
        <button data-day="day1" class="day-tab-btn h-10 px-6 rounded-xl font-bold text-sm bg-stone-900 text-white shadow-md transition-all duration-200 whitespace-nowrap cursor-pointer">
          Day 1 — Saturday, Oct 3
        </button>
        <button data-day="day2" class="day-tab-btn h-10 px-6 rounded-xl font-bold text-sm bg-white text-stone-600 border border-stone-300 hover:border-stone-400 hover:text-stone-900 transition-all duration-200 whitespace-nowrap cursor-pointer">
          Day 2 — Sunday, Oct 4
        </button>
      </div>

      <!-- Mobile Court Switcher -->
      <div id="mobileCourtTabs" class="inline-flex items-center p-1 rounded-xl bg-stone-100 border border-stone-200/50 lg:hidden">
        <!-- Dynamically filled by app.js -->
      </div>
    </div>

    <!-- Schedule Grid -->
    <div class="rounded-2xl border border-stone-200/70 bg-white overflow-hidden shadow-card relative flex flex-col">
      <div class="overflow-x-auto relative" id="gridTableContainer">
        <!-- Dynamically rendered by app.js -->
      </div>
    </div>

  </main>

  <!-- ═══════════════ TOURNAMENT DRAW / TABLE MODAL ═══════════════ -->
  <div id="bracketModal" class="fixed inset-0 z-50 hidden items-center justify-center p-3 sm:p-6 bg-stone-950/60 backdrop-blur-sm overflow-hidden" role="dialog" aria-modal="true">
    <div id="bracketModalBackdrop" class="fixed inset-0 cursor-pointer"></div>
    <div class="relative w-full max-w-6xl max-h-[90vh] bg-white rounded-2xl shadow-2xl border border-stone-200/80 flex flex-col z-10 modal-animate-scale overflow-hidden">
      <div id="bracketModalContent" class="flex flex-col h-full min-h-0 overflow-hidden">
        <!-- Dynamically rendered by app.js -->
      </div>
    </div>
  </div>

  <!-- ═══════════════ COURT MATCHES / ORDER OF PLAY MODAL ═══════════════ -->
  <div id="courtMatchesModal" class="fixed inset-0 z-50 hidden items-center justify-center p-3 sm:p-6 bg-stone-950/60 backdrop-blur-sm overflow-hidden" role="dialog" aria-modal="true">
    <div id="courtMatchesModalBackdrop" class="fixed inset-0 cursor-pointer"></div>
    <div class="relative w-full max-w-2xl max-h-[85vh] bg-white rounded-2xl shadow-2xl border border-stone-200/80 flex flex-col z-10 modal-animate-scale overflow-hidden">
      <div id="courtMatchesModalContent" class="flex flex-col h-full min-h-0 overflow-hidden">
        <!-- Dynamically rendered by app.js -->
      </div>
    </div>
  </div>

  <!-- ═══════════════ LOCATION / DIRECTIONS MODAL ═══════════════ -->
  <div id="locationModal" class="fixed inset-0 z-50 hidden items-center justify-center p-3 sm:p-6 bg-stone-950/70 backdrop-blur-md overflow-hidden" role="dialog" aria-modal="true">
    <div id="locationModalBackdrop" class="fixed inset-0 cursor-pointer"></div>
    <div class="relative w-full max-w-xl bg-white rounded-2xl sm:rounded-3xl shadow-2xl border border-stone-200/80 flex flex-col z-10 modal-animate-scale overflow-hidden max-h-[92vh]">
      
      <!-- Close Button -->
      <button 
        onclick="closeLocationModal()" 
        class="absolute top-3 right-3 z-20 w-9 h-9 rounded-full bg-stone-900/60 hover:bg-stone-900/90 text-white backdrop-blur-md flex items-center justify-center cursor-pointer transition-all shadow-md active:scale-95"
        title="Close (Esc)">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>

      <!-- Modal Scroll Container -->
      <div class="overflow-y-auto flex flex-col">
        <!-- Full Venue Photo (Clean, no text overlay) -->
        <div class="relative w-full bg-stone-100 border-b border-stone-100 flex items-center justify-center">
          <img 
            id="locationVenueImage" 
            src="91club.png" 
            alt="91Club Pickleball" 
            class="w-full h-auto max-h-[52vh] object-cover sm:object-contain bg-stone-900/5 block" 
          />
        </div>

        <!-- Venue Information & Navigation (Outside the photo) -->
        <div class="p-5 sm:p-6 space-y-5 bg-white">
          
          <!-- Venue Header Info -->
          <div class="space-y-1.5">
            <div class="flex items-center gap-2">
              <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-rose-50 border border-rose-200/80 text-rose-600 text-[11px] font-extrabold uppercase tracking-wider">
                <i data-lucide="map-pin" class="w-3 h-3"></i>
                <span>Official Venue</span>
              </span>
              <span class="text-xs text-stone-400 font-semibold uppercase tracking-wider">Da Nang, Vietnam</span>
            </div>
            
            <h3 id="locationVenueName" class="text-2xl font-display font-black text-stone-900 leading-tight">
              91Club Pickleball
            </h3>
            <p id="locationVenueAddress" class="text-sm font-medium text-stone-600">
              91Club Pickleball & Coffee
            </p>
          </div>

          <!-- Navigation Buttons -->
          <div class="pt-1">
            <div class="text-[11px] font-bold text-stone-400 uppercase tracking-wider mb-2.5">
              Open Navigation / Directions
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <a 
                id="googleMapsBtn"
                href="https://maps.app.goo.gl/8dorv6RPoKmyqaCt9" 
                target="_blank" 
                rel="noopener noreferrer"
                class="flex items-center justify-center gap-2.5 py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-display font-bold text-sm shadow-sm hover:shadow transition-all cursor-pointer">
                <i data-lucide="navigation" class="w-4 h-4"></i>
                <span>Google Maps</span>
              </a>
              <a 
                id="appleMapsBtn"
                href="https://maps.apple/p/3dUGmPID3WGoQ1" 
                target="_blank" 
                rel="noopener noreferrer"
                class="flex items-center justify-center gap-2.5 py-3 px-4 rounded-xl bg-stone-900 hover:bg-stone-800 active:scale-[0.98] text-white font-display font-bold text-sm shadow-sm hover:shadow transition-all cursor-pointer">
                <i data-lucide="map" class="w-4 h-4"></i>
                <span>Apple Maps</span>
              </a>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="data.js?v=261"></script>
  <script src="app.js?v=264"></script>
</body>
</html>
