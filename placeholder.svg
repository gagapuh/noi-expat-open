<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Shield Background -->
  <rect width="64" height="64" rx="16" fill="#0f172a"/>
  
  <!-- Subtle inner gradient border -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#borderGrad)" stroke-width="2"/>
  
  <!-- Pickleball Paddle -->
  <path d="M22 14C17.5817 14 14 17.5817 14 22V32C14 36.4183 17.5817 40 22 40H30C34.4183 40 38 36.4183 38 32V22C38 17.5817 34.4183 14 30 14H22Z" fill="url(#paddleGrad)"/>
  
  <!-- Paddle Grip / Handle -->
  <path d="M23 40L20 52C19.5 54 21 55.5 23 55.5H29C31 55.5 32.5 54 32 52L29 40H23Z" fill="#334155"/>
  <line x1="21.5" y1="45" x2="30.5" y2="45" stroke="#64748b" stroke-width="1.5"/>
  <line x1="21" y1="49" x2="31" y2="49" stroke="#64748b" stroke-width="1.5"/>

  <!-- Pickleball (with holes) -->
  <circle cx="43" cy="24" r="11" fill="#84cc16"/>
  <!-- Holes -->
  <circle cx="43" cy="24" r="1.8" fill="#0f172a"/>
  <circle cx="39" cy="20" r="1.5" fill="#0f172a"/>
  <circle cx="47" cy="20" r="1.5" fill="#0f172a"/>
  <circle cx="39" cy="28" r="1.5" fill="#0f172a"/>
  <circle cx="47" cy="28" r="1.5" fill="#0f172a"/>
  <circle cx="43" cy="16" r="1.3" fill="#0f172a"/>
  <circle cx="43" cy="32" r="1.3" fill="#0f172a"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="paddleGrad" x1="14" y1="14" x2="38" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
</svg>
